schema: 1
name: tandem
description: Transparent split-TCP relay - send a laptop's TCP through a faster LAN machine when it measures faster.
homepage: https://github.com/BogdanStamenovic/tandem
tags: [networking, systemd, nftables, go]
install:
  platforms: [linux]
  setup:
    linux: [./deploy/lifecycle.sh setup]
  update:
    linux: [./deploy/lifecycle.sh update]
  remove:
    linux: [./deploy/lifecycle.sh remove]
command:
  linux: bin/tandem
